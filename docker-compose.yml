services:
  sftp:
    image: atmoz/sftp:latest
    ports:
      - "2222:22"
    volumes:
      - "./testdata/outbox:/home/demo/outbox"
      - "./testdata/bigdata:/home/demo/bigdata"
      - "./testdata/onlydir:/home/demo/onlydir"
      - "./testdata/root.txt:/home/demo/root.txt"
    command:
      - "demo:password:::outbox,upload"
